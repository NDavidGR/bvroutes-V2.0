<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BV Plan del día</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1c1e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23FFC107' font-family='sans-serif' font-weight='700'%3EBV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=8">
<link rel="stylesheet" href="css/plan.css?v=8">
</head>
<body class="planpage">

<div id="pp" hidden>
  <header class="top">
    <button id="pp-menu" class="icon only-mobile" aria-label="Rutas">☰</button>
    <a href="index.html" class="btn-ghost lnkbtn">← Rutas</a>
    <h1><span>BV</span> Plan del día</h1>
    <input type="date" id="pp-date" aria-label="Fecha del plan">
    <div class="spacer"></div>
    <span id="pp-status" class="muted small"></span>
  </header>

  <aside id="pp-side">
    <div class="side-title">Camiones</div>
    <div id="pp-routes"></div>
  </aside>

  <main id="pp-main">
    <div class="pp-bar">
      <div class="pp-title" id="pp-title"></div>
      <span class="spacer"></span>
      <span id="pp-pill" class="pill"></span>
      <button id="pp-map" class="btn-ghost">↗ Ver mapa</button>
      <button id="pp-go" class="btn">ORGANIZE</button>
    </div>
    <div class="pp-work">
      <section class="pp-panel">
        <div class="pp-ph"><span>Input</span><button id="pp-clear" class="lnk">Limpiar</button></div>
        <textarea id="pp-input" placeholder="Pega aquí las paradas del día, una por línea…" spellcheck="false"></textarea>
      </section>
      <section class="pp-panel">
        <div class="pp-ph"><span>Output</span><button id="pp-copy" class="lnk">Copiar</button></div>
        <ol id="pp-out"></ol>
        <div id="pp-empty" class="pp-empty">Pega las paradas y pulsa ORGANIZE.</div>
      </section>
    </div>
  </main>
</div>

<dialog id="dlg-map" class="mapdlg">
  <div class="mapdlg-head"><h2 id="pm-title"></h2><label class="chk"><input type="checkbox" id="pm-line" checked> Línea</label><span class="spacer"></span><button id="pm-close" class="icon" aria-label="Cerrar">✕</button></div>
  <div class="pmwrap"><div id="pmap"></div><div id="pm-msg" class="pm-msg" hidden></div></div>
</dialog>

<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="js/config.js?v=8"></script>
<script src="js/auth.js?v=8"></script>
<script src="js/data.js?v=8"></script>
<script src="js/map.js?v=8"></script>
<script src="js/planpage.js?v=8"></script>
</body>
</html>
