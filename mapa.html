<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BV Mapa del día</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1c1e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23FFC107' font-family='sans-serif' font-weight='700'%3EBV%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=12">
<link rel="stylesheet" href="css/mapa.css?v=12">
</head>
<body class="mapapage">
<div id="mp" hidden>
  <header class="top">
    <a href="plan.html" class="btn-ghost lnkbtn">← Plan</a>
    <h1><span>BV</span> Mapa del día</h1>
    <input type="date" id="mp-date" aria-label="Fecha">
    <div id="mp-routes" class="mp-routes"></div>
    <button id="mp-all" class="btn-ghost sm">Todas</button>
    <button id="mp-none" class="btn-ghost sm">Ninguna</button>
    <label class="chk"><input type="checkbox" id="mp-line" checked> Línea</label>
    <span class="hint">clic: prender · doble clic: aislar</span>
    <div class="spacer"></div>
    <span id="mp-upd" class="muted small"></span>
    <button id="mp-refresh" class="btn-ghost sm">Actualizar</button>
  </header>
  <div class="mp-body">
    <div id="mp-mapwrap"><div id="mp-map"></div><div id="mp-msg" class="mp-msg" hidden></div></div>
    <aside id="mp-side">
      <div class="side-title">Sin ubicar</div>
      <div id="mp-miss-sub" class="muted small"></div>
      <div id="mp-miss"></div>
    </aside>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="js/config.js?v=12"></script>
<script src="js/auth.js?v=12"></script>
<script src="js/data.js?v=12"></script>
<script src="js/map.js?v=12"></script>
<script src="js/mapa.js?v=12"></script>
</body>
</html>
